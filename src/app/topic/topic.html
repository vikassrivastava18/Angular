<div class="d-flex flex-nowrap justify-content-between mt-4">
    @for (topic of topics(); track topic.topic) {
    <div class="card m-4 topicItem">
        <h5 class="card-header">{{ topic.topic }}</h5>
        <div class="card-body">
            <p class="card-text">{{ topic.detail }}</p>
        </div>
    </div>
    }

</div>
